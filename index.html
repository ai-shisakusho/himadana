<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7e9">
  <meta name="description" content="暇なとき、やりたかったことを1つ決めて、そのまま始めるための小さなアプリ。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>暇なにする？</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section id="homeView" class="view is-active" aria-labelledby="homeTitle">
      <header class="topbar">
        <div>
          <p class="eyebrow">Prototype 004</p>
          <h1 id="homeTitle">暇なにする？</h1>
        </div>
        <button id="openManageButton" class="icon-button" type="button" aria-label="やりたいことを管理">⚙</button>
      </header>

      <div class="hero-card">
        <div class="mini-character" aria-hidden="true">
          <span class="mini-eye left"></span>
          <span class="mini-eye right"></span>
          <span class="mini-mouth"></span>
        </div>
        <p class="hero-kicker">暇なら、1個だけ。</p>
        <h2>今、どれくらい暇？</h2>
        <p class="subtle">時間を選べば、その中でできることを勝手に決めます。</p>

        <div class="time-options" role="group" aria-label="暇な時間">
          <button class="time-chip" type="button" data-minutes="5">5分</button>
          <button class="time-chip" type="button" data-minutes="15">15分</button>
          <button class="time-chip" type="button" data-minutes="30">30分</button>
          <button class="time-chip" type="button" data-minutes="60">60分</button>
        </div>

        <button id="pickButton" class="primary-button" type="button" disabled>何する？</button>
      </div>

      <div class="today-card" aria-live="polite">
        <span>今日できたこと</span>
        <strong><span id="todayCount">0</span>個</strong>
      </div>

      <p class="privacy-note">登録内容はこの端末だけに保存されます。</p>
    </section>

    <section id="suggestionView" class="view suggestion-view" aria-labelledby="suggestionTitle">
      <button id="backHomeFromSuggestion" class="back-button" type="button">← 戻る</button>

      <div id="pressureStage" class="pressure-stage phase-calm">
        <div id="pressureCharacter" class="pressure-character" aria-hidden="true">
          <span class="eye left"></span>
          <span class="eye right"></span>
          <span class="mouth"></span>
        </div>

        <p class="eyebrow">今日やるのは…</p>
        <h2 id="suggestionTitle" class="suggestion-title"></h2>
        <p id="suggestionMinutes" class="suggestion-minutes"></p>

        <div class="countdown-wrap" aria-live="polite">
          <span class="countdown-label">決めるまで</span>
          <strong id="decisionCountdown" class="decision-countdown">10</strong>
        </div>

        <p id="pressureMessage" class="pressure-message"></p>
      </div>

      <p id="skipNudge" class="skip-nudge" aria-live="polite"></p>

      <div class="stack-actions">
        <button id="acceptButton" class="primary-button" type="button">これにする！</button>
        <button id="skipButton" class="secondary-button" type="button">別のを出す</button>
      </div>
    </section>

    <section id="timerView" class="view timer-view" aria-labelledby="timerTitle">
      <p class="eyebrow">開始したら、あとはやるだけ。</p>
      <h2 id="timerTitle"></h2>
      <div id="timerDisplay" class="timer-display" aria-live="polite">00:00</div>
      <p id="timerStatus" class="subtle">いってらっしゃい。</p>

      <div class="stack-actions">
        <button id="pauseResumeButton" class="secondary-button" type="button">一時停止</button>
        <button id="completeButton" class="primary-button" type="button">できた！</button>
        <button id="cancelTimerButton" class="text-button danger-text" type="button">やめる</button>
      </div>
    </section>

    <section id="completeView" class="view complete-view" aria-labelledby="completeTitle">
      <div class="complete-mark" aria-hidden="true">✓</div>
      <p class="eyebrow">ちゃんと始めた。えらい。</p>
      <h2 id="completeTitle">できた！</h2>
      <p id="completeActivity" class="complete-activity"></p>
      <p id="completeStats" class="complete-stats"></p>

      <button id="doAgainButton" class="primary-button" type="button">まだ暇？ もう一回</button>
      <button id="completeHomeButton" class="text-button" type="button">今日はここまで</button>
    </section>

    <section id="manageView" class="view manage-view" aria-labelledby="manageTitle">
      <header class="topbar">
        <div>
          <p class="eyebrow">やりたいこと</p>
          <h2 id="manageTitle">行動を管理</h2>
        </div>
        <button id="closeManageButton" class="icon-button" type="button" aria-label="管理画面を閉じる">✕</button>
      </header>

      <p class="subtle manage-intro">最初のサンプルは自由に編集できます。やりたくないものはOFFでOK。</p>

      <form id="activityForm" class="activity-form" novalidate>
        <input id="editingId" type="hidden">

        <label>
          <span>やること</span>
          <input id="activityNameInput" type="text" maxlength="40" placeholder="例：英単語を覚える" required>
        </label>

        <label>
          <span>時間</span>
          <select id="activityMinutesInput" required>
            <option value="5">5分</option>
            <option value="10">10分</option>
            <option value="15">15分</option>
            <option value="20">20分</option>
            <option value="30">30分</option>
            <option value="45">45分</option>
            <option value="60">60分</option>
          </select>
        </label>

        <p id="formError" class="form-error" role="alert"></p>

        <div class="form-buttons">
          <button id="saveActivityButton" class="primary-button compact" type="submit">追加する</button>
          <button id="cancelEditButton" class="secondary-button compact is-hidden" type="button">編集をやめる</button>
        </div>
      </form>

      <div id="activityList" class="activity-list"></div>

      <button id="resetSamplesButton" class="text-button danger-text reset-button" type="button">サンプル行動に戻す</button>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
